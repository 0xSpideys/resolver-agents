name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build wasm
        run: cargo build --target wasm32v1-none --release
      - name: Regenerate site status report
        run: node scripts/report.mjs
        env:
          CARGO: cargo
      # The committed report.json is what Vercel renders (no cargo there).
      # Regenerating here proves the script still works and that the numbers
      # the site shows are reproducible. It is not diffed against the commit —
      # generatedAt and commit hash differ by construction.
      - name: Show generated report
        run: node -e "const r=require('./apps/site/src/data/report.json');console.log(r.test.ok?'PASS':'FAIL',r.test.passed+'/'+(r.test.passed+r.test.failed),r.build.wasm&&r.build.wasm.sha256)"
