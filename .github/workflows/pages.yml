name: Deploy site

# Publishes apps/site to GitHub Pages on every push to main.
#
# Pages needs no third-party account — the repository already lives here — and
# the site is fully static, so there is nothing to run at request time.
#
# The status page renders the committed apps/site/src/data/report.json. This
# workflow deliberately does not regenerate it: reproducing the wasm hash needs
# the Stellar CLI, and installing that on every deploy would add minutes to
# publish a number that only changes when the contract does. Run `make report`
# locally and commit the result when the suite or the contract changes.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win rather than queue behind an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # enablement lets the workflow turn Pages on itself. Selecting "GitHub
      # Actions" in the repository settings does not always create the Pages
      # resource until a deployment has succeeded, which makes the first run
      # fail here on a fresh repository.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          # Pages serves a project site from /<repo>, so routes and assets need
          # that prefix. configure-pages reports it, so a custom domain later
          # needs no change here.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
